name: Dominican Republic 

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Run scraper
        run: |
          python update_DominicanRepublic_countries.py

      - name: Commit updated country list
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          echo "Checking generated file:"
          cat DominicanRepublic_countries.txt

          git status

          git add DominicanRepublic_countries.txt

          git commit -m "Update DominicanRepublic country list" || echo "No changes to commit"

          git push
